<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kavopay API Tester</title>
<style>
  body{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#0d1420;color:#e6edf3;max-width:480px;margin:40px auto;padding:0 20px}
  h1{font-size:20px}
  label{display:block;font-size:13px;color:#9aa7b4;margin:16px 0 6px}
  input{width:100%;padding:10px 12px;border-radius:8px;border:1px solid #2a3542;background:#161d29;color:#e6edf3;font-family:monospace;font-size:13px;box-sizing:border-box}
  button{margin-top:20px;width:100%;padding:12px;border:none;border-radius:8px;background:#14b8a6;color:#04241f;font-weight:700;font-size:14px;cursor:pointer}
  button:disabled{opacity:.6;cursor:default}
  pre{margin-top:20px;padding:14px;border-radius:8px;background:#161d29;border:1px solid #2a3542;font-size:13px;white-space:pre-wrap;word-break:break-all}
  .status{font-weight:700}
  .ok{color:#4ade80}
  .err{color:#f87171}
</style>
</head>
<body>

<h1>Kavopay API Tester</h1>
<p>Test your keys against <code>GET /v1/balance</code> directly from this page. Nothing is sent anywhere except Kavopay's API.</p>

<label for="pub">Public key</label>
<input id="pub" placeholder="kavo_pub_xxxxxxxxxxxxxxxx">

<label for="sec">Secret key</label>
<input id="sec" type="password" placeholder="kavo_live_xxxxxxxxxxxxxxxx">

<button id="run">Check balance</button>

<pre id="out" style="display:none"></pre>

<script>
const runBtn = document.getElementById("run");
const out = document.getElementById("out");

runBtn.addEventListener("click", async () => {
  const pub = document.getElementById("pub").value.trim();
  const sec = document.getElementById("sec").value.trim();
  out.style.display = "block";
  out.textContent = "Loading...";
  runBtn.disabled = true;

  try {
    const res = await fetch("https://api.kavopaywalletz.com/v1/balance", {
      headers: {
        "X-Public-Key": pub,
        "Authorization": "Bearer " + sec
      }
    });
    const data = await res.json();
    const label = res.ok
      ? `<span class="status ok">${res.status} ${res.statusText}</span>`
      : `<span class="status err">${res.status} ${res.statusText}</span>`;
    out.innerHTML = label + "\n\n" + JSON.stringify(data, null, 2);
  } catch (err) {
    out.innerHTML = `<span class="status err">Network error</span>\n\n${err.message}`;
  }

  runBtn.disabled = false;
});
</script>

</body>
</html>
